[project]
name = "inspobot"
version = "0.1.0"
description = "Утренняя подборка интерфейсных референсов из Mobbin в Telegram"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3,<2",
    "httpx>=0.27",
]

[project.scripts]
inspobot-daily = "inspobot.daily:main"
inspobot-feed = "inspobot.feed:main"
inspobot-setup = "inspobot.setup_cli:main"
inspobot-auth = "inspobot.auth_cli:main"
inspobot-doctor = "inspobot.doctor:main"
inspobot-top = "inspobot.top:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inspobot"]
