name: Утренний дайджест

on:
  schedule:
    # 08:07 UTC — это 11:07 по Москве. Минуту сдвинул с нуля намеренно:
    # в начале часа очередь Actions самая длинная, а расписание тут всё равно
    # не будильник и может опоздать на десятки минут.
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Отправить, даже если сегодня уже слали
        type: boolean
        default: false
      dry_run:
        description: Только показать в логе, ничего не отправлять
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш памяти о показанном
        uses: actions/cache@v4
        with:
          # Только база. Токен Mobbin в кэш класть нельзя: кэши доступны
          # рабочим процессам форков, а секреты — нет.
          path: var/inspobot.sqlite3
          key: inspobot-state-${{ github.run_id }}
          restore-keys: inspobot-state-

      - name: Зависимости
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Разложить секреты по местам
        env:
          MOBBIN_TOKEN_JSON: ${{ secrets.MOBBIN_TOKEN_JSON }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          set -e
          mkdir -p var
          if [ -z "$MOBBIN_TOKEN_JSON" ]; then
            echo "::error::Нет секрета MOBBIN_TOKEN_JSON — см. docs/GITHUB_ACTIONS.md"
            exit 1
          fi
          printf '%s' "$MOBBIN_TOKEN_JSON" > var/mobbin_token.json
          chmod 600 var/mobbin_token.json
          if [ -n "$TELEGRAM_CHAT_IDS" ]; then
            printf '%s\n' "$TELEGRAM_CHAT_IDS" > var/chats.txt
          fi
          # Запоминаем, каким токен пришёл: после запуска сравним.
          sha256sum var/mobbin_token.json | cut -d' ' -f1 > var/token.sha

      - name: Собрать и отправить
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          INSPOBOT_EFFORT: ${{ vars.INSPOBOT_EFFORT || 'medium' }}
          INSPOBOT_IMAGE_MODE: ${{ vars.INSPOBOT_IMAGE_MODE || 'photo' }}
          INSPOBOT_TZ: ${{ vars.INSPOBOT_TZ || 'Europe/Moscow' }}
          INSPOBOT_PROFILE: config/profile.json
          INSPOBOT_CHATS: var/chats.txt
          MOBBIN_TOKEN_FILE: var/mobbin_token.json
          INSPOBOT_DB: var/inspobot.sqlite3
        run: |
          # Не «[ … ] && …»: GitHub запускает шаг через bash -e, и ложное
          # условие в последней строке уронило бы шаг с кодом 1.
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m inspobot.daily --verbose $ARGS

      - name: Сохранить обновлённый токен Mobbin
        # Даже если отправка упала: токен мог обновиться до сбоя, и потерять
        # его — значит завтра остаться без доступа.
        if: always()
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -e
          [ -f var/mobbin_token.json ] || exit 0
          NEW=$(sha256sum var/mobbin_token.json | cut -d' ' -f1)
          OLD=$(cat var/token.sha 2>/dev/null || echo "")
          if [ "$NEW" = "$OLD" ]; then
            echo "Токен не менялся — секрет трогать не нужно."
            exit 0
          fi
          if [ -z "$GH_SECRETS_TOKEN" ]; then
            echo "::warning::Токен Mobbin обновился, но нет секрета GH_SECRETS_TOKEN — записать некуда. Следующий запуск может не пройти."
            exit 0
          fi
          pip install --quiet pynacl
          python tools/update_github_secret.py MOBBIN_TOKEN_JSON var/mobbin_token.json

      - name: Убрать секреты с диска
        if: always()
        run: rm -f var/mobbin_token.json var/token.sha var/chats.txt
